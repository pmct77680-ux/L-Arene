<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1d33">
<title>Arène 3D</title>
<style>
:root{--nuit:#1a1d33;--carte:#262a4a;--texte:#f2f0ff;--gris:#9a9cc4;--on:#ffc247;--off:#4a4e78}
*{box-sizing:border-box}
body{margin:0;background:var(--nuit);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
main{max-width:460px;margin:0 auto;padding:24px 20px}
h1{font-size:28px;margin:0 0 4px}
p{color:var(--gris);margin:0 0 20px;line-height:1.4}
input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--off);background:var(--carte);color:var(--texte);font-size:17px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--on)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;color:var(--nuit);background:var(--on);width:100%}
button.gris{background:var(--carte);color:var(--texte)}
.msg{color:var(--on);min-height:22px;margin:10px 0}
.ou{text-align:center;color:var(--gris);margin:16px 0}
#ui{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cache{display:none}
</style>
</head>
<body>
<div id="menu"><main>
  <h1>Arène 3D</h1>
  <p>Tire sur les autres, esquive et grimpe au classement. 20 joueurs maximum.</p>
  <p>Ordi : ZQSD ou WASD pour bouger, souris pour viser et cliquer pour tirer. Téléphone : stick gauche pour bouger, stick droit pour viser et tirer.</p>
  <input id="pseudo" placeholder="Ton pseudo" maxlength="15" autocomplete="off">
  <button id="creer">Créer une partie</button>
  <div class="ou">ou</div>
  <input id="code" placeholder="Code de la partie" maxlength="6" autocomplete="off">
  <button id="rejoindre" class="gris">Rejoindre</button>
  <div class="msg" id="msg"></div>
</main></div>
<canvas id="ui" class="cache"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const W = 1200, H = 1200, R = 16, MAXJ = 20, PREF = 'squadarene3d-';
const ui = $('ui'), u = ui.getContext('2d');
let peer, hote = null, estHote = false, code = '', myId = '', nom = '', dpr = 1, n = 0;
let conns = {}, P = {}, B = [], noms = {}, disp = {}, snap = { b: [], t: 0 };
let kx = 0, ky = 0, mx = 0, my = 0, mf = 0, tactile = false;
let renderer, scene, camera, cv, objs = {}, pool = [];
const keys = {}, st = { l: null, r: null };

try { nom = JSON.parse(localStorage.getItem('sg') || '{}').nom || ''; } catch (e) {}
$('pseudo').value = nom;
const msg = t => { $('msg').textContent = t || ''; };

function pseudo() {
  nom = $('pseudo').value.trim().slice(0, 15);
  if (!nom) { msg('Écris ton pseudo.'); return false; }
  try { localStorage.setItem('sg', JSON.stringify({ nom })); } catch (e) {}
  return true;
}

/* ---------- Commandes ---------- */
function touche(e, v) {
  keys[e.key.toLowerCase()] = v;
  kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.q || keys.arrowleft ? 1 : 0);
  ky = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.z || keys.arrowup ? 1 : 0);
}
addEventListener('keydown', e => touche(e, true));
addEventListener('keyup', e => touche(e, false));
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
addEventListener('mouseup', () => { mf = 0; });

function brancher() {
  cv.addEventListener('mousedown', () => { mf = 1; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('touchstart', e => {
    e.preventDefault(); tactile = true;
    for (const t of e.changedTouches) {
      const s = t.clientX < innerWidth / 2 ? 'l' : 'r';
      if (!st[s]) st[s] = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
    }
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) for (const s in st)
      if (st[s] && st[s].id === t.identifier) { st[s].x = t.clientX; st[s].y = t.clientY; }
  }, { passive: false });
  const fin = e => {
    for (const t of e.changedTouches) for (const s in st)
      if (st[s] && st[s].id === t.identifier) st[s] = null;
  };
  cv.addEventListener('touchend', fin);
  cv.addEventListener('touchcancel', fin);
}

/* La souris vise un point du sol : on lance un rayon depuis la caméra */
const ray = new THREE.Raycaster(), sol = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pt = new THREE.Vector3(), v2 = new THREE.Vector2();
function viseeSouris() {
  const me = disp[myId];
  if (!me || !camera) return [0, 0];
  v2.set(mx / innerWidth * 2 - 1, -(my / innerHeight) * 2 + 1);
  ray.setFromCamera(v2, camera);
  if (!ray.ray.intersectPlane(sol, pt)) return [0, 0];
  return [pt.x - me.x, pt.z - me.y];
}

function lireInput() {
  let dx = kx, dy = ky, ax = 0, ay = 0, f = mf;
  if (tactile) f = 0; else [ax, ay] = viseeSouris();
  if (st.l) { dx = (st.l.x - st.l.ox) / 50; dy = (st.l.y - st.l.oy) / 50; }
  if (st.r) { ax = st.r.x - st.r.ox; ay = st.r.y - st.r.oy; f = Math.hypot(ax, ay) > 12 ? 1 : 0; }
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  return { dx, dy, ax, ay, f };
}

/* ---------- Serveur (le créateur de la partie) ---------- */
function nouveau(id, nomJ) {
  const p = { id, nom: nomJ || 'Joueur', x: 0, y: 0, a: 0, hp: 100, k: 0, d: 0, mort: 0, cd: 0, in: { dx: 0, dy: 0, ax: 0, ay: 0, f: 0 } };
  renaitre(p);
  return p;
}
function renaitre(p) {
  p.x = 100 + Math.random() * (W - 200);
  p.y = 100 + Math.random() * (H - 200);
  p.hp = 100; p.mort = 0;
}
function diffNoms() {
  noms = {};
  for (const id in P) noms[id] = P[id].nom;
  for (const id in conns) if (conns[id].open) conns[id].send({ t: 'n', n: noms });
}

function tick() {
  const dt = 0.033;
  if (P.hote) P.hote.in = lireInput();
  for (const id in P) {
    const p = P[id];
    if (p.mort > 0) { p.mort -= dt; if (p.mort <= 0) renaitre(p); continue; }
    const i = p.in;
    p.x = Math.max(R, Math.min(W - R, p.x + i.dx * 220 * dt));
    p.y = Math.max(R, Math.min(H - R, p.y + i.dy * 220 * dt));
    if (i.ax || i.ay) p.a = Math.atan2(i.ay, i.ax);
    p.cd -= dt;
    if (i.f && p.cd <= 0) {
      p.cd = 0.25;
      const co = Math.cos(p.a), si = Math.sin(p.a);
      B.push({ x: p.x + co * R, y: p.y + si * R, vx: co * 650, vy: si * 650, a: p.a, o: id, t: 1 });
    }
  }
  for (let i = B.length - 1; i >= 0; i--) {
    const b = B[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt;
    let fin = b.t <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H;
    if (!fin) for (const id in P) {
      const p = P[id];
      if (id === b.o || p.mort > 0) continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) < R + 4) {
        p.hp -= 25; fin = true;
        if (p.hp <= 0) { p.mort = 2; p.d++; if (P[b.o]) P[b.o].k++; }
        break;
      }
    }
    if (fin) B.splice(i, 1);
  }
  if (++n % 2 === 0) {
    const s = {
      t: 's',
      p: Object.values(P).map(p => [p.id, Math.round(p.x), Math.round(p.y), Math.round(p.a * 100) / 100, p.hp, p.k, p.d, p.mort > 0 ? 1 : 0]),
      b: B.map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.a * 100) / 100])
    };
    for (const id in conns) if (conns[id].open) conns[id].send(s);
    recevoir(s);
  }
}

function creer() {
  if (!pseudo()) return;
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  code = Array.from({ length: 6 }, () => al[Math.floor(Math.random() * al.length)]).join('');
  msg('Création...');
  peer = new Peer(PREF + code);
  peer.on('open', () => {
    estHote = true; myId = 'hote';
    P.hote = nouveau('hote', nom);
    diffNoms(); lancer(); setInterval(tick, 33);
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); creer(); }
    else msg('Problème de connexion. Réessaie.');
  });
  peer.on('connection', c => {
    c.on('open', () => {
      if (Object.keys(P).length >= MAXJ) { c.send({ t: 'plein' }); setTimeout(() => c.close(), 500); return; }
      conns[c.peer] = c;
    });
    c.on('data', d => {
      if (!conns[c.peer]) return;
      if (d.t === 'j' && !P[c.peer]) { P[c.peer] = nouveau(c.peer, String(d.nom || 'Joueur').slice(0, 15)); diffNoms(); }
      else if (d.t === 'i' && P[c.peer]) {
        const v = q => Math.max(-1, Math.min(1, +q || 0));
        P[c.peer].in = { dx: v(d.dx), dy: v(d.dy), ax: +d.ax || 0, ay: +d.ay || 0, f: d.f ? 1 : 0 };
      }
    });
    c.on('close', () => { delete P[c.peer]; delete conns[c.peer]; diffNoms(); });
  });
}

/* ---------- Joueur qui rejoint ---------- */
function rejoindre() {
  if (!pseudo()) return;
  code = $('code').value.trim().toUpperCase();
  if (code.length !== 6) { msg('Le code fait 6 caractères.'); return; }
  msg('Connexion...');
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    hote = peer.connect(PREF + code, { reliable: true });
    const delai = setTimeout(() => { peer.destroy(); msg('Partie introuvable. Le créateur doit garder la page ouverte.'); }, 8000);
    hote.on('open', () => {
      clearTimeout(delai);
      hote.send({ t: 'j', nom });
      lancer();
      setInterval(() => { if (hote.open) hote.send({ t: 'i', ...lireInput() }); }, 50);
    });
    hote.on('data', d => {
      if (d.t === 's') recevoir(d);
      else if (d.t === 'n') noms = d.n;
      else if (d.t === 'plein') { alert('Partie pleine (20 joueurs maximum).'); location.reload(); }
    });
    hote.on('close', () => { alert('La partie est terminée.'); location.reload(); });
  });
  peer.on('error', () => msg('Problème de connexion. Réessaie.'));
}

/* ---------- Affichage 3D ---------- */
function recevoir(s) {
  snap = { b: s.b, t: performance.now() };
  const nd = {};
  for (const a of s.p) {
    const o = disp[a[0]];
    nd[a[0]] = { x: o && !o.dead ? o.x : a[1], y: o && !o.dead ? o.y : a[2], tx: a[1], ty: a[2], a: a[3], hp: a[4], k: a[5], d: a[6], dead: a[7] };
  }
  disp = nd;
}

function couleur(id) {
  if (id === myId) return '#ffc247';
  let h = 0;
  for (const ch of id) h += ch.charCodeAt(0);
  return 'hsl(' + (h * 37 % 360) + ',70%,62%)';
}

function creerJoueur(id) {
  const g = new THREE.Group(), corps = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(couleur(id)) });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 26, 16), mat); b.position.y = 13;
  const t = new THREE.Mesh(new THREE.SphereGeometry(R * 0.75, 16, 12), mat); t.position.y = 32;
  const c = new THREE.Mesh(new THREE.BoxGeometry(24, 6, 6), new THREE.MeshLambertMaterial({ color: 0xf2f0ff }));
  c.position.set(R + 6, 20, 0);
  corps.add(b, t, c); g.add(corps);
  const hp = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x7CE0A8 }));
  hp.center.set(0, 0.5); hp.position.set(-18, 62, 0); hp.scale.set(36, 4, 1);
  const lab = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true }));
  lab.position.y = 76; lab.scale.set(96, 24, 1);
  g.add(hp, lab); scene.add(g);
  return { g, corps, hp, lab, nom: null };
}

function majLabel(o) {
  const cn = document.createElement('canvas'); cn.width = 256; cn.height = 64;
  const k = cn.getContext('2d');
  k.font = 'bold 30px system-ui'; k.textAlign = 'center'; k.fillStyle = '#f2f0ff';
  k.fillText(o.nom, 128, 42);
  if (o.lab.material.map) o.lab.material.map.dispose();
  o.lab.material.map = new THREE.CanvasTexture(cn);
  o.lab.material.needsUpdate = true;
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  ui.width = innerWidth * dpr; ui.height = innerHeight * dpr;
}

function lancer() {
  $('menu').classList.add('cache');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  cv = renderer.domElement;
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block';
  document.body.appendChild(cv);
  ui.classList.remove('cache');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12142a);
  scene.fog = new THREE.Fog(0x12142a, 500, 1100);
  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 2000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const soleil = new THREE.DirectionalLight(0xffffff, 0.8); soleil.position.set(300, 600, 200); scene.add(soleil);
  const terre = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshLambertMaterial({ color: 0x20244a }));
  terre.rotation.x = -Math.PI / 2; terre.position.set(W / 2, 0, H / 2); scene.add(terre);
  const grille = new THREE.GridHelper(W, 12, 0x3a3f78, 0x2d3261); grille.position.set(W / 2, 0.5, H / 2); scene.add(grille);
  const mur = new THREE.MeshLambertMaterial({ color: 0xffc247, emissive: 0x553300 });
  [[W + 8, 4, W / 2, -2], [W + 8, 4, W / 2, H + 2], [4, H + 8, -2, H / 2], [4, H + 8, W + 2, H / 2]].forEach(([sx, sz, px, pz]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, 40, sz), mur); m.position.set(px, 20, pz); scene.add(m);
  });
  brancher(); resize(); addEventListener('resize', resize); dessiner();
}

function dessiner() {
  requestAnimationFrame(dessiner);
  for (const id in disp) { const d = disp[id]; d.x += (d.tx - d.x) * 0.35; d.y += (d.ty - d.y) * 0.35; }
  for (const id in objs) if (!disp[id]) { scene.remove(objs[id].g); delete objs[id]; }
  for (const id in disp) {
    const d = disp[id];
    const o = objs[id] || (objs[id] = creerJoueur(id));
    o.g.visible = !d.dead;
    o.g.position.set(d.x, 0, d.y);
    o.corps.rotation.y = -d.a;
    o.hp.scale.x = Math.max(0.01, 36 * d.hp / 100);
    if (o.nom !== (noms[id] || '')) { o.nom = noms[id] || ''; majLabel(o); }
  }
  const dt = (performance.now() - snap.t) / 1000;
  snap.b.forEach((b, i) => {
    let m = pool[i];
    if (!m) { m = pool[i] = new THREE.Mesh(new THREE.SphereGeometry(4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); scene.add(m); }
    m.visible = true;
    m.position.set(b[0] + Math.cos(b[2]) * 650 * dt, 16, b[1] + Math.sin(b[2]) * 650 * dt);
  });
  for (let i = snap.b.length; i < pool.length; i++) pool[i].visible = false;
  const me = disp[myId], cx = me ? me.x : W / 2, cy = me ? me.y : H / 2;
  camera.position.set(cx, 340, cy + 300);
  camera.lookAt(cx, 0, cy);
  renderer.render(scene, camera);
  hud(me);
}

function hud(me) {
  const w = innerWidth, h = innerHeight;
  u.setTransform(dpr, 0, 0, dpr, 0, 0);
  u.clearRect(0, 0, w, h);
  u.textAlign = 'left'; u.fillStyle = '#f2f0ff'; u.font = 'bold 15px system-ui';
  u.fillText('Code : ' + code + ' (' + Object.keys(disp).length + ' joueurs)', 12, 24);
  u.textAlign = 'right';
  u.fillText('Classement', w - 12, 24);
  u.font = '14px system-ui';
  Object.entries(disp).sort((a, b) => b[1].k - a[1].k).slice(0, 5)
    .forEach(([id, d], i) => u.fillText((noms[id] || '?') + '  ' + d.k + ' / ' + d.d, w - 12, 46 + i * 20));
  if (me && me.dead) {
    u.textAlign = 'center'; u.font = 'bold 22px system-ui';
    u.fillText('Éliminé, retour dans 2 secondes', w / 2, h / 2);
  }
  for (const s of ['l', 'r']) if (st[s]) {
    const t = st[s], dx = t.x - t.ox, dy = t.y - t.oy, l = Math.hypot(dx, dy), m = l > 50 ? 50 / l : 1;
    u.strokeStyle = 'rgba(242,240,255,.5)'; u.lineWidth = 3;
    u.beginPath(); u.arc(t.ox, t.oy, 50, 0, 7); u.stroke();
    u.fillStyle = 'rgba(255,194,71,.7)';
    u.beginPath(); u.arc(t.ox + dx * m, t.oy + dy * m, 22, 0, 7); u.fill();
  }
}

$('creer').onclick = creer;
$('rejoindre').onclick = rejoindre;
</script>
</body>
</html>
